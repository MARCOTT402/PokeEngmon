<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype — Gym Challenge Entry (Display Window)</title>
<style>
  @font-face {
    font-family: "DotGothic16";
    src: url("../assets/fonts/dotgothic16-latin.woff2") format("woff2");
    font-display: swap;
  }
  @font-face {
    font-family: "PokeRogueEmerald";
    src: url("../assets/fonts/pokemon-emerald-pro.ttf") format("truetype");
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "DotGothic16", monospace;
    background: #2b2b33;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 12px 60px;
    color: #fff;
  }
  h1 { font-size: 1rem; margin-bottom: 4px; font-weight: 400; }
  .sub { font-size: .72rem; color: #9aa; margin-bottom: 20px; }

  /* ===== 簡化版 Pokédex 機身（只保留比例結構） ===== */
  .device {
    width: 100%; max-width: 400px;
    background: linear-gradient(180deg, #f0524a 0%, #e03a32 55%, #d42f28 100%);
    border: 3px solid #2f2f2f; border-radius: 22px;
    padding: 8px 10px 10px;
    box-shadow: 0 10px 24px rgba(0,0,0,.4);
  }
  .screen {
    background: #fff; border: 3px solid #2f2f2f; border-radius: 16px;
    margin: 6px; padding: 10px 12px 12px;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 480px;
    color: #23252b;
  }
  .hero {
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .hero img { width: 104px; height: 104px; image-rendering: pixelated; }
  .hero .name { font-size: 1.05rem; }
  .hero .meta { font-size: .8rem; color: #7a8299; }
  .hpbar { width: 100%; height: 8px; background: #e2e7ef; border-radius: 4px; overflow: hidden; }
  .hpbar i { display: block; height: 100%; width: 72%; background: linear-gradient(90deg,#7ac74c,#4f9e2e); }
  .spacer { flex: 1; }
  .cta {
    min-height: 56px; border: none; border-radius: 14px;
    background: linear-gradient(180deg, #a6d967, #82bf45);
    border: 3px solid #5f8f33; color: #20320f;
    font-family: inherit; font-size: 1rem; cursor: pointer;
  }
  .dock { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .dock div { height: 40px; border-radius: 10px; background: #eef1f6; border: 2px solid #d5dae3; }

  /* ============================================================
     CHALLENGE 閃字入口 —— 三個閃法版本
     ============================================================ */
  .gym-challenge {
    position: relative;
    width: 100%;
    border: none;
    cursor: pointer;
    font-family: "DotGothic16", monospace;
    border-radius: 10px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 46px;
  }
  .gym-challenge .gc-txt {
    font-size: 1.25rem;
    letter-spacing: .18em;
    font-weight: 400;
  }
  .gym-challenge .gc-vs {
    font-size: .8rem; letter-spacing: .1em; opacity: .8;
  }

  /* --- Variant A：街機 hard blink（step 閃，紅黑警告帶底） --- */
  .gc-a {
    background:
      repeating-linear-gradient(-45deg, #d42f28 0 14px, #23252b 14px 28px);
    box-shadow: inset 0 0 0 2px #23252b, 0 3px 0 #8e1f1a;
  }
  .gc-a .gc-txt, .gc-a .gc-vs { color: #ffe259; text-shadow: 2px 2px 0 #23252b; }
  .gc-a .gc-inner {
    background: rgba(35,37,43,.82);
    padding: 6px 22px; border-radius: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .gc-a .gc-inner { animation: gc-blink 1s steps(2, jump-none) infinite; }
  @keyframes gc-blink { 50% { opacity: .15; } }

  /* --- Variant B：金底黑字 + 掃光（shine sweep） --- */
  .gc-b {
    background: linear-gradient(180deg, #ffe566, #f0c020);
    box-shadow: inset 0 0 0 2px #b8860b, 0 3px 0 #8a6508;
  }
  .gc-b .gc-txt { color: #23252b; }
  .gc-b .gc-vs { color: #4a3808; }
  .gc-b::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 46%;
    left: -50%;
    background: linear-gradient(105deg, transparent 0%, rgba(255,255,255,.85) 50%, transparent 100%);
    animation: gc-sweep 1.6s ease-in-out infinite;
  }
  @keyframes gc-sweep { 0% { left: -50%; } 60%, 100% { left: 120%; } }

  /* --- Variant C：霓虹脈衝（glow pulse，深底黃字） --- */
  .gc-c {
    background: #23252b;
    box-shadow: inset 0 0 0 2px #ffe259, 0 3px 0 #111;
  }
  .gc-c .gc-txt, .gc-c .gc-vs {
    color: #ffe259;
    text-shadow: 0 0 6px #ffe259, 0 0 14px #ffb300;
    animation: gc-pulse 1.1s ease-in-out infinite;
  }
  @keyframes gc-pulse {
    0%, 100% { opacity: 1; text-shadow: 0 0 6px #ffe259, 0 0 14px #ffb300; }
    50% { opacity: .55; text-shadow: 0 0 2px #ffe259; }
  }

  /* ===== 切換器 ===== */
  .switcher { display: flex; gap: 8px; margin: 18px 0 10px; }
  .switcher button {
    font-family: inherit; font-size: .8rem; padding: 8px 14px;
    background: #3a3b44; color: #fff; border: 2px solid #555; border-radius: 8px; cursor: pointer;
  }
  .switcher button.on { background: #ffe259; color: #23252b; border-color: #ffe259; }
  .note { font-size: .72rem; color: #889; max-width: 400px; line-height: 1.6; margin-top: 14px; }
</style>
</head>
<body>

<h1>Gym Challenge Entry — Prototype</h1>
<p class="sub">閃字圖入口 · 放喺 display window（hero 卡同 START QUIZ 之間）</p>

<div class="switcher">
  <button data-v="gc-a" class="on">A 街機硬閃</button>
  <button data-v="gc-b">B 金底掃光</button>
  <button data-v="gc-c">C 霓虹脈衝</button>
  <button data-v="off">唔出現</button>
</div>

<div class="device">
  <div class="screen">
    <div class="hero">
      <img src="../assets/poke/25.gif" alt="" onerror="this.style.visibility='hidden'">
      <span class="name">Pikachu</span>
      <span class="meta">Common · Lv.12 ★</span>
      <div class="hpbar"><i></i></div>
    </div>

    <!-- CHALLENGE 入口（預設 Variant A） -->
    <button class="gym-challenge gc-a" id="gc-entry" type="button">
      <span class="gc-inner">
        <span class="gc-vs">⚔ GYM ×3</span>
        <span class="gc-txt">CHALLENGE</span>
        <span class="gc-vs">⚔</span>
      </span>
    </button>

    <div class="spacer"></div>
    <button class="cta" type="button">▶ START QUIZ (10 questions)</button>
    <div class="dock"><div></div><div></div><div></div><div></div></div>
  </div>
</div>

<p class="note">
  規則：夠條件（streak 達 milestone 且未攞 badge）先 render 呢條入口；<br>
  點擊 → Gym.startChallenge()。<br>
  A = step 硬閃（最似街機）；B = 金底 + 白光掃過；C = 霓虹呼吸。<br>
  三個版本都係純 CSS，無 JS 動畫，性能冇負擔。
</p>

<script>
  const entry = document.getElementById("gc-entry");
  document.querySelectorAll(".switcher button").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(".switcher button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      const v = b.dataset.v;
      if (v === "off") { entry.style.display = "none"; return; }
      entry.style.display = "";
      entry.className = "gym-challenge " + v;
    };
  });
  entry.onclick = () => alert("→ Gym.startChallenge()");
</script>
</body>
</html>
