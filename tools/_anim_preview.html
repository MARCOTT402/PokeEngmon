<!DOCTYPE html>
<!-- Dev-only harness：抽樣目測 battle anim。用法：/tools/_anim_preview.html?slug=surf,rest,transform,body-press -->
<html>
<head>
<meta charset="utf-8">
<base href="../">
<title>anim preview</title>
<style>
  body { margin: 0; background: #333; font: 14px monospace; color: #fff; }
  #stage { position: relative; width: 480px; height: 360px; margin: 20px auto;
           background: #7ec850 url("assets/battle/ui/bg_grass.png") center/cover; overflow: hidden; }
  #atk { position: absolute; left: 60px; bottom: 40px; width: 96px; height: 96px; background: rgba(0,0,255,.25); }
  #def { position: absolute; right: 60px; top: 40px; width: 96px; height: 96px; background: rgba(255,0,0,.25); }
  #fx { position: absolute; inset: 0; }
  .moveanim-layer { position: absolute; background-repeat: no-repeat; }
  #label { text-align: center; padding: 8px; font-size: 18px; }
</style>
</head>
<body>
<div id="label">…</div>
<div id="stage">
  <div id="def"></div>
  <div id="atk"></div>
  <div id="fx"></div>
</div>
<script src="js/battle/moveanim.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const slugs = (q.get("slug") || "surf,rest,transform,body-press").split(",");
  const frameMs = parseInt(q.get("frameMs") || "400", 10);   /* slow-mo 方便截圖 */
  const label = document.getElementById("label");
  const layer = document.getElementById("fx");
  const stageEl = document.getElementById("stage");
  const atkEl = document.getElementById("atk");
  const defEl = document.getElementById("def");
  let i = 0;
  window.__played = [];
  async function loop() {
    const slug = slugs[i % slugs.length];
    label.textContent = slug + " (" + (i + 1) + ")";
    const ms = await MoveAnim.play(slug, { layer, stageEl, attackerEl: atkEl, defenderEl: defEl, frameMs });
    window.__played.push([slug, ms]);
    if (!ms) label.textContent = slug + " -> NO RESOURCE (fallback)";
    i++;
    setTimeout(loop, Math.max(400, ms) + 700);
  }
  loop();
</script>
</body>
</html>
