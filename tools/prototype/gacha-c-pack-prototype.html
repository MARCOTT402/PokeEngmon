<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Booster Pack Rip — Gacha C Prototype</title>
<!--
  PokeEngmon 扭蛋玩法 C「卡包撕開」prototype（方案：.trae/specs/20261107-gacha-redesign.md §10；由玩法 A 衍生，共用快龍 rig／音效）
  開法：python -m http.server 8080 → http://localhost:8080/tools/prototype/gacha-v2-prototype.html
  純前端、零依賴（用 repo 內 vendor/gsap + assets），唔接 Supabase；結果全部本地隨機。
-->
<style>
@font-face { font-family: "PkEmerald"; src: url("../../assets/fonts/pokemon-emerald-pro-latin.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "InterV"; src: url("../../assets/fonts/inter-latin-var.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }

:root {
  --rare: #4aa8ff; --epic: #ffc93c; --legend: #c77dff;
  --ink: #0d1024; --glass: rgba(18, 20, 48, .62); --line: rgba(255,255,255,.14);
  --txt: #f4f6ff; --muted: #b8bee0;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #05060f; color: var(--txt); font-family: "InterV", system-ui, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

.phone {
  position: relative; margin: 0 auto; width: 100%; max-width: 440px; height: 100dvh; max-height: 956px;
  overflow: hidden; container-type: size; background: #0b0d22; user-select: none;
}
@media (min-width: 500px) { body { display: grid; place-items: center; } .phone { border-radius: 28px; box-shadow: 0 0 0 10px #15172b, 0 30px 80px #000; height: min(100dvh - 40px, 956px); } }
.hidden { display: none !important; }

/* ================= LOBBY ================= */
#lobby { position: absolute; inset: 0; display: flex; flex-direction: column; }
.sky { position: absolute; inset: 0; background: linear-gradient(180deg, #171a46 0%, #3d2f7a 34%, #a3508a 58%, #f08a5d 78%, #ffd59e 100%); overflow: hidden; }
.sun { position: absolute; left: 50%; bottom: 14%; width: 70cqw; height: 70cqw; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,230,170,.9) 0 18%, rgba(255,170,110,.35) 40%, transparent 68%); }
.cloud { position: absolute; border-radius: 50%; background: radial-gradient(ellipse at 50% 60%, rgba(255,235,225,.75), rgba(255,200,200,.0) 70%); filter: blur(2px); animation: drift linear infinite; }
@keyframes drift { from { transform: translateX(-60cqw); } to { transform: translateX(160cqw); } }
.twinkle { position: absolute; inset: 0 0 50% 0; }
.twinkle i { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; animation: tw 2.6s ease-in-out infinite; }
@keyframes tw { 50% { opacity: .15; } }

.topbar { position: relative; z-index: 3; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 12px) 14px 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 6px; border-radius: 99px; background: rgba(5,8,30,.55); border: 1px solid var(--line); font-weight: 800; font-size: 15px; backdrop-filter: blur(6px); }
.gem { width: 22px; height: 22px; flex: none; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(5,8,30,.55); border: 1px solid var(--line); display: grid; place-items: center; font-size: 16px; }
.spacer { flex: 1; }

.banner { position: relative; z-index: 2; margin: 14px 16px 0; padding: 12px 14px; border-radius: 18px; background: linear-gradient(135deg, rgba(25,18,70,.75), rgba(90,40,120,.55)); border: 1px solid rgba(255,220,150,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 8px 24px rgba(0,0,0,.3); display: flex; align-items: center; gap: 10px; }
.banner .kicker { font: 11px/1 "PkEmerald", monospace; letter-spacing: 2px; color: #ffd98a; }
.banner h1 { margin: 4px 0 2px; font-size: 22px; font-weight: 900; letter-spacing: -.3px; background: linear-gradient(180deg, #fff, #ffe2a0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.banner p { margin: 0; font-size: 12px; color: var(--muted); }
.featured { display: flex; margin-left: auto; }
.featured img { width: 40px; height: 40px; object-fit: contain; image-rendering: pixelated; margin-left: -10px; filter: drop-shadow(0 0 6px rgba(199,125,255,.8)); }

.lobby-mid { position: relative; z-index: 2; flex: 1; display: grid; place-items: center; }
.dnite-wrap { position: relative; width: min(58cqw, 36cqh); transform-origin: 50% 90%; }
.dnite-wrap .rig { position: relative; width: 100%; filter: drop-shadow(0 12px 18px rgba(40,10,60,.45)); cursor: pointer; }
/* 快龍 rig：同一張圖拆成翼／尾／身／手四層（tools/prototype/assets/dnite-*.png，同一座標系），各自繞關節轉 */
.rig { position: absolute; aspect-ratio: 640 / 829; }
.rig-face, .rig-bob { position: absolute; inset: 0; }
.rl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; -webkit-user-drag: none; }
.rl-wing { transform-origin: 53.9% 35%; }
.rl-tail { transform-origin: 71% 72.4%; }
.rl-arm { transform-origin: 22.7% 39.8%; }
.rl-arm img { width: 100%; height: 100%; display: block; }
.rig-hand { position: absolute; left: 7%; top: 33%; width: 0; height: 0; }
.ball.held .shadow { display: none; }
.dnite-shadow { position: absolute; left: 22%; right: 22%; bottom: -8%; height: 7%; border-radius: 50%; background: radial-gradient(rgba(40,10,50,.45), transparent 70%); }
.bubble { position: absolute; top: 4%; right: -6%; padding: 6px 10px; border-radius: 12px 12px 12px 2px; background: #fff; color: #2a2150; font-weight: 800; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,.25); }

.pity { position: relative; z-index: 2; margin: 0 20px 10px; }
.pity-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); margin-bottom: 5px; }
.pity-bar { height: 8px; border-radius: 99px; background: rgba(10,10,40,.45); overflow: hidden; border: 1px solid rgba(255,255,255,.2); }
.pity-fill { height: 100%; width: 30%; border-radius: inherit; background: linear-gradient(90deg, #ffc93c, #ff8a3c); box-shadow: 0 0 10px #ffc93c; transition: width .5s; }
.odds { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; position: relative; z-index: 2; }
.chip { font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 99px; background: rgba(5,8,30,.55); border: 1px solid currentColor; }

.cta { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 1.25fr; gap: 10px; padding: 0 14px calc(env(safe-area-inset-bottom) + 16px); }
.pull-btn { position: relative; height: 74px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 900; letter-spacing: .5px; transition: transform .08s, filter .2s; box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35); }
.pull-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35); }
.pull-btn .big { font-size: 20px; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.pull-btn .cost { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 9px; border-radius: 99px; background: rgba(0,0,0,.25); }
.pull-btn .cost .gem { width: 16px; height: 16px; }
.btn-1 { background: linear-gradient(180deg, #5fb8ff, #2a6fd6); }
.btn-10 { background: linear-gradient(180deg, #ffd85a, #f39a1e); color: #3a1d00; }
.btn-10 .big { text-shadow: 0 2px 0 rgba(255,255,255,.4); }
.btn-10 .cost { background: rgba(80,40,0,.18); }
.ribbon { position: absolute; top: -10px; right: 10px; font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 6px; background: #ff3b6b; color: #fff; box-shadow: 0 3px 8px rgba(255,59,107,.5); animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.pull-btn.poor { filter: grayscale(.85) brightness(.75); }
.shake-x { animation: shx .4s; }
@keyframes shx { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

/* ================= STAGE ================= */
#stage { position: absolute; inset: 0; z-index: 10; overflow: hidden; }
.night { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 120%, #3a2a7a 0%, #1a1747 40%, #070818 80%); }
.night .twinkle { inset: 0 0 35% 0; }
.ground { position: absolute; left: -10%; right: -10%; bottom: 0; height: 34%; background: radial-gradient(ellipse at 50% 0%, #2b2468 0%, #14123a 55%, #090a1f 100%); border-top-left-radius: 50% 22%; border-top-right-radius: 50% 22%; }
.ground-ring { position: absolute; left: 50%; top: 61%; width: 40cqw; height: 9cqw; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid rgba(255,255,255,.0); }
.speed { position: absolute; inset: 0; opacity: 0; background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255,255,255,.06) 22px 24px); }
#dnite-rig { width: 46cqw; left: 0; top: 0; opacity: 0; pointer-events: none; will-change: transform, filter; }
#gshadow { position: absolute; left: 0; top: 64%; width: 40cqw; height: 7cqw; margin: -3.5cqw 0 0 -20cqw; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.6), transparent 70%); opacity: 0; pointer-events: none; }
#nclouds { position: absolute; inset: 0; pointer-events: none; }
.ncloud { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(160,150,240,.20), transparent 70%); filter: blur(3px); }

.rays { position: absolute; left: 50%; top: 44%; width: 220cqw; height: 220cqw; margin: -110cqw 0 0 -110cqw; opacity: 0; pointer-events: none; }
.rays::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, var(--rc, #fff) 0deg 6deg, transparent 6deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 18%, transparent 46%); mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 18%, transparent 46%);
  animation: spin 14s linear infinite; }
.rays.rainbow::before { background: repeating-conic-gradient(from 0deg, #ff6b6b 0deg 6deg, transparent 6deg 12deg, #ffd93c 12deg 18deg, transparent 18deg 24deg, #6bff9b 24deg 30deg, transparent 30deg 36deg, #6bc5ff 36deg 42deg, transparent 42deg 48deg, #c77dff 48deg 54deg, transparent 54deg 60deg); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Poké Ball */
.ball { position: absolute; --rc: #fff; pointer-events: auto; }
.ball[data-type="great"] { --rc: var(--rare); }
.ball[data-type="ultra"] { --rc: var(--epic); }
.ball[data-type="master"] { --rc: var(--legend); }
.ball .hw { position: absolute; left: 0; width: 100%; height: 50%; will-change: transform; }
.ball .hw.top { top: 0; } .ball .hw.bot { top: 50%; }
.ball .hw svg { display: block; width: 100%; height: 100%; overflow: hidden; }
.ball .aura { position: absolute; inset: -55%; border-radius: 50%; background: radial-gradient(circle, var(--rc) 0%, transparent 62%); opacity: 0; mix-blend-mode: screen; pointer-events: none; }
.ball .leak { position: absolute; left: -12%; right: -12%; top: 50%; height: 16%; transform: translateY(-50%); border-radius: 50%; background: radial-gradient(ellipse, #fff 0%, var(--rc) 35%, transparent 70%); opacity: 0; filter: blur(2px); mix-blend-mode: screen; pointer-events: none; }
.ball .crk { opacity: 0; }
.ball .shadow { position: absolute; left: 10%; right: 10%; bottom: -14%; height: 14%; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.55), transparent 70%); pointer-events: none; }
.ball.idle-pulse .aura { animation: aura 1.2s ease-in-out infinite; }
@keyframes aura { 0%,100% { opacity: .35; transform: scale(.9); } 50% { opacity: .7; transform: scale(1.05); } }
.tap-ring { position: absolute; left: 50%; top: 50%; width: 150%; height: 150%; transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid var(--rc); opacity: 0; pointer-events: none; animation: tapring 1.2s ease-out infinite; }
@keyframes tapring { 0% { opacity: .9; transform: translate(-50%,-50%) scale(.6); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.25); } }

/* Reveal */
#reveal { position: absolute; inset: 0; pointer-events: none; }
.pillar { position: absolute; left: 50%; bottom: 30%; width: 34cqw; height: 0; transform: translateX(-50%); background: linear-gradient(0deg, rgba(255,255,255,.95), var(--rc, #fff) 35%, transparent); filter: blur(6px); opacity: 0; mix-blend-mode: screen; }
.halo { position: absolute; left: 50%; top: 42%; width: 70cqw; height: 70cqw; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.9) 0%, var(--rc, #fff) 25%, transparent 62%); opacity: 0; mix-blend-mode: screen; }
.mon-wrap { position: absolute; left: 50%; top: 42%; width: 64cqw; height: 50cqw; transform: translate(-50%, -50%); display: grid; place-items: end center; }
.mon { image-rendering: pixelated; opacity: 0; transform-origin: 50% 90%; }
.mon.sil { filter: brightness(0) drop-shadow(0 0 10px var(--rc)) drop-shadow(0 0 22px var(--rc)); }
.rstars { position: absolute; left: 0; right: 0; top: calc(42% + 30cqw); display: flex; justify-content: center; gap: 4px; }
.rstars span { font-size: 9cqw; line-height: 1; color: var(--rc); text-shadow: 0 0 10px var(--rc), 0 2px 0 rgba(0,0,0,.4); opacity: 0; display: inline-block; }
.nameplate { position: absolute; left: 50%; top: calc(42% + 42cqw); transform: translateX(-50%); text-align: center; opacity: 0; white-space: nowrap; }
.nameplate .rlabel { display: block; font: 3.2cqw/1 "PkEmerald", monospace; letter-spacing: 3px; color: var(--rc); }
.nameplate .rname { display: block; margin-top: 4px; font-size: 9cqw; font-weight: 900; letter-spacing: -.5px; text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px var(--rc); }
.stamp { position: absolute; right: 12%; top: 18%; padding: 6px 12px; border-radius: 10px; border: 4px solid #ff3b6b; color: #ff3b6b; font-weight: 900; font-size: 7cqw; transform: rotate(-14deg); opacity: 0; background: rgba(255,255,255,.92); box-shadow: 0 6px 20px rgba(255,59,107,.5); }
.stamp.dupe { border-color: #ffb13b; color: #b0610a; font-size: 4.4cqw; }

/* FX layers */
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
.hint { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 13%); text-align: center; font: 4.4cqw/1.2 "PkEmerald", monospace; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px rgba(120,160,255,.8); opacity: 0; pointer-events: none; }
.callout { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); font-size: 10cqw; font-weight: 900; font-style: italic; letter-spacing: -1px; white-space: nowrap; color: #fff; -webkit-text-stroke: 1.5px rgba(0,0,0,.4); text-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 24px var(--rc, #fff); opacity: 0; pointer-events: none; }
.stage-btn { position: absolute; z-index: 30; height: 38px; padding: 0 14px; border-radius: 99px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); font-weight: 800; font-size: 13px; letter-spacing: 1px; backdrop-filter: blur(4px); }
#skip { top: calc(env(safe-area-inset-top) + 12px); right: 14px; }
#open-all { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 4%); height: 52px; padding: 0 28px; font-size: 16px; background: linear-gradient(180deg, #ffd85a, #f39a1e); color: #3a1d00; border: 0; box-shadow: 0 5px 0 rgba(0,0,0,.35), 0 0 30px rgba(255,200,60,.5); }

/* 10-pull grid sprites */
.slot-mon { position: absolute; image-rendering: pixelated; transform: translate(-50%, -62%); pointer-events: none; filter: drop-shadow(0 0 6px var(--rc)); }
.slot-stars { position: absolute; transform: translate(-50%, 0); font-size: 3cqw; letter-spacing: -1px; color: var(--rc); text-shadow: 0 0 6px var(--rc); pointer-events: none; white-space: nowrap; }
.slot-new { position: absolute; transform: translate(-50%, -50%) rotate(-10deg); font-size: 2.8cqw; font-weight: 900; padding: 1px 5px; border-radius: 5px; background: #ff3b6b; color: #fff; pointer-events: none; }
.slot-glow { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, var(--rc) 0%, transparent 65%); opacity: .55; pointer-events: none; mix-blend-mode: screen; }

/* ================= RESULT SHEET ================= */
.sheet { position: absolute; z-index: 40; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); border-radius: 26px 26px 0 0; background: linear-gradient(180deg, rgba(24,26,64,.94), rgba(10,11,30,.98)); border-top: 1px solid rgba(255,255,255,.18); box-shadow: 0 -20px 50px rgba(0,0,0,.5); transform: translateY(110%); }
.sheet-hero { position: relative; height: 34cqw; margin: -6px -6px 10px; border-radius: 18px; overflow: hidden; display: grid; place-items: center; background: radial-gradient(circle at 50% 60%, var(--rc), #0b0c24 70%); }
.sheet-hero img { image-rendering: pixelated; position: relative; }
.sheet-hero .rays { top: 50%; width: 130cqw; height: 130cqw; margin: -65cqw 0 0 -65cqw; opacity: .5; }
.s-head { display: flex; align-items: center; gap: 8px; }
.s-rar { font: 11px/1 "PkEmerald", monospace; letter-spacing: 2px; padding: 5px 8px; border-radius: 6px; color: #10122a; background: var(--rc); }
.s-stars { color: var(--rc); letter-spacing: 1px; text-shadow: 0 0 8px var(--rc); font-size: 16px; }
.s-name { margin: 8px 0 4px; display: flex; align-items: baseline; gap: 8px; }
.s-name b { font-size: 26px; font-weight: 900; letter-spacing: -.5px; }
.s-name .no { font: 14px "PkEmerald", monospace; color: var(--muted); }
.say { margin-left: auto; height: 36px; padding: 0 12px; border-radius: 99px; background: rgba(255,255,255,.1); border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
.types { display: flex; gap: 6px; margin-bottom: 10px; }
.type { font-size: 11px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
.gain { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.gain b { color: #fff; }
.gain .tag-new { font-weight: 900; color: #fff; background: #ff3b6b; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
.actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-top: 14px; }
.btn { height: 54px; border-radius: 16px; font-weight: 900; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn .gem { width: 18px; height: 18px; }
.btn.primary { background: linear-gradient(180deg, #5fb8ff, #2a6fd6); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.btn.primary.gold { background: linear-gradient(180deg, #ffd85a, #f39a1e); color: #3a1d00; }
.btn.ghost { background: rgba(255,255,255,.08); border: 1px solid var(--line); }
.btn:active { transform: translateY(2px); }

/* ================= SUMMARY ================= */
#summary { position: absolute; inset: 0; z-index: 35; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 16px); background: radial-gradient(ellipse at 50% 0%, #2c2470 0%, #0d0e26 60%); }
#summary h2 { margin: 0; text-align: center; font: 7cqw/1 "PkEmerald", monospace; letter-spacing: 3px; color: #ffe39a; text-shadow: 0 3px 0 rgba(0,0,0,.5); }
.s-sub { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 14px; }
.sgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; perspective: 800px; }
.card { position: relative; aspect-ratio: 3 / 4.4; border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 55%, #101230), #101230 80%); border: 2px solid color-mix(in srgb, var(--rc) 70%, #fff 0%); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 4px 2px 5px; transform-style: preserve-3d; cursor: pointer; }
.card img { image-rendering: pixelated; flex: 1; min-height: 0; max-width: 100%; object-fit: contain; }
.card .cn { font-size: 2.6cqw; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.card .cs { font-size: 2.4cqw; color: var(--rc); letter-spacing: -1px; }
.card .cnew { position: absolute; top: 3px; left: 3px; font-size: 2.3cqw; font-weight: 900; background: #ff3b6b; padding: 1px 4px; border-radius: 4px; }
.card .cdup { position: absolute; top: 3px; left: 3px; font-size: 2.3cqw; font-weight: 900; background: rgba(0,0,0,.5); padding: 1px 4px; border-radius: 4px; }
.card.best { box-shadow: 0 0 0 2px #fff, 0 0 22px var(--rc); }
.card.best::after { content: "👑"; position: absolute; top: -2px; right: 2px; font-size: 3.6cqw; }
.card.legend { animation: cardglow 1.6s ease-in-out infinite; }
@keyframes cardglow { 50% { box-shadow: 0 0 0 2px #fff, 0 0 30px var(--legend); } }
.totals { display: flex; justify-content: center; gap: 8px; margin: 16px 0 0; flex-wrap: wrap; }
.totals span { font-size: 13px; font-weight: 800; padding: 7px 12px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid var(--line); }
#summary .actions { margin-top: auto; }

/* toast + dev panel */
.toast { position: absolute; z-index: 60; left: 50%; top: 18%; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: rgba(0,0,0,.8); font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap; }

};

  psychic:"#f87c7a", ghost:"#5f6dbc", dragon:"#0a6dc4", ice:"#74cec0", rock:"#c9bb8a", flying:"#8fa8dd", bug:"#90c12c", fairy:"#ec8fe6" };

  epic:   { stars: 4, ball: "ultra",  color: "#ffc93c", label: "★4 EPIC" },

};

const RANK = { rare: 0, epic: 1, legend: 2 };

/* ================================================================
   STATE

const S = { gems: 300, pity: 10, owned: new Set([25, 7, 133, 1]), force: "auto", speed: 1, sound: true,
            skip: false, busy: false, mode: null, last: null, multi: null };

/* ================================================================
   TIMING (skip-aware): sleep / play resolve instantly once SKIP pressed
   ================================================================ */
const pend = new Set(), tls = new Set();
let tapRes = null;
function sleep(ms) {
  if (S.skip) return Promise.resolve();
  return new Promise(res => { const o = { res }; o.id = setTimeout(() => { pend.delete(o); res(); }, ms / S.speed); pend.add(o); });
}
function play(tl) {
  if (S.skip) { tl.progress(1); return Promise.resolve(); }
  return new Promise(res => { tls.add(tl); tl.eventCallback("onComplete", () => { tls.delete(tl); res(); }); });
}
function fire(tl) { if (S.skip) tl.progress(1); else { tls.add(tl); tl.eventCallback("onComplete", () => tls.delete(tl)); } return tl; }
function doSkip() {
  if (S.skip || !S.busy) return;
  S.skip = true;
  pend.forEach(o => { clearTimeout(o.id); o.res(); }); pend.clear();
  Array.from(tls).forEach(t => t.progress(1)); tls.clear();
  if (tapRes) tapRes();
  fx.clear();

/* ================================================================
   AUDIO — WebAudio synth (zero files) + Pokémon cries
   ================================================================ */
const Snd = {
  ctx: null, out: null, rev: null, nb: null, amb: null,
  init() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(c.destination);
    this.out = c.createGain(); this.out.gain.value = .8; this.out.connect(comp);
    this.rev = c.createConvolver(); this.rev.buffer = this._ir(2.4);
    const rg = c.createGain(); rg.gain.value = .32; this.rev.connect(rg); rg.connect(this.out);
    const len = c.sampleRate * 2; this.nb = c.createBuffer(1, len, c.sampleRate);
    const d = this.nb.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  _ir(sec) { const c = this.ctx, n = c.sampleRate * sec, b = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6); } return b; },
  ok() { return this.ctx && S.sound && !S.skip; },
  tone({ f = 440, to = null, t = 0, d = .3, type = "sine", g = .2, a = .006, rev = 0, lp = 0 }) {
    if (!this.ok()) return; const c = this.ctx, t0 = c.currentTime + t;
    const o = c.createOscillator(), v = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
    v.gain.setValueAtTime(0.0001, t0); v.gain.exponentialRampToValueAtTime(g, t0 + a); v.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    let node = o; if (lp) { const fl = c.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; o.connect(fl); node = fl; }
    node.connect(v); v.connect(this.out); if (rev) { const s = c.createGain(); s.gain.value = rev; v.connect(s); s.connect(this.rev); }

  dust(x, y, n = 18) { for (let i = 0; i < n; i++) { const dir = Math.random() < .5 ? -1 : 1;

/* ================================================================
   PULL LOGIC (prototype: local random; production = server settlement)
   ================================================================ */
function rollRarity() {
  if (S.force !== "auto") return S.force;
  const r = Math.random(); return r < .05 ? "legend" : r < .20 ? "epic" : "rare";
}
/* 演出路線：起始球種 + 升級次數 + tease。純視覺，只由「最終稀有度」推導 */
function planPath(rar) {
  const r = Math.random();
  if (rar === "rare")  return { start: "great", ups: [], tease: r < .25, trail: "#ffffff" };
  if (rar === "epic")  return r < .55 ? { start: "great", ups: ["ultra"], trail: Math.random() < .5 ? "#ffc93c" : "#ffffff" } : { start: "ultra", ups: [], trail: "#ffc93c" };
  if (r < .4) return { start: "great", ups: ["ultra", "master"], trail: "#ffc93c" };
  if (r < .8) return { start: "ultra", ups: ["master"], trail: "#ffc93c" };
  return { start: "master", ups: [], trail: "rainbow" };
}
function makePull(minEpic) {
  let rar = rollRarity();
  if ((minEpic || S.pity <= 1) && rar === "rare") rar = "epic";
  S.pity = rar === "rare" ? S.pity - 1 : 10;
  const list = POOL[rar], m = list[Math.floor(Math.random() * list.length)];
  const isNew = !S.owned.has(m[0]); S.owned.add(m[0]);
  return { id: m[0], name: m[1], types: m[2], rarity: rar, isNew, plan: planPath(rar) };
}

    const strip = pack.querySelector(".pk-strip"), peel = pack.querySelector(".pk-peel"), cut = pack.querySelector(".pk-cut");
    gsap.to(cut, { opacity: 1, duration: .3 });
    hint("SWIPE ALONG THE TOP → TO TEAR");
    let p = 0, tearing = false, lastSnd = 0, done = false, idle;
    const nudge = () => { clearTimeout(idle); idle = setTimeout(() => { if (!done) { hint("SWIPE LEFT → RIGHT ALONG THE DOTS"); gsap.fromTo("#hint", { scale: 1.2 }, { scale: 1, duration: .4, ease: "back.out(3)" }); } }, 3500); };
    nudge();
    const set = v => {
      strip.style.clipPath = `inset(0 0 0 ${v * 100}%)`;
      peel.style.opacity = v > 0 ? 1 : 0; peel.style.clipPath = `inset(0 ${100 - v * 100}% 0 0)`;
      gsap.set(peel, { rotate: -v * 24, y: -v * 12, transformOrigin: `${v * 100}% 100%` });
      gsap.set(pack.querySelector(".pk-glow"), { opacity: v * .85 });
    };
    const down = e => { if (e.target.closest(".stage-btn")) return; const r = pack.getBoundingClientRect();
      const ry = (e.clientY - r.top) / r.height, rx = (e.clientX - r.left) / r.width;
      if (ry < -.25 || ry > .5 || rx < -.25 || rx > 1.25) return;
      tearing = true; if (p === 0 && rx > .45) hint("START FROM THE LEFT EDGE ←"); };
    const move = e => {
      if (!tearing || done) return; const r = pack.getBoundingClientRect(), rx = (e.clientX - r.left) / r.width;
      if (p === 0 && rx > .45) return;
      const np = Math.max(p, Math.min(1, rx)); if (np <= p) return; p = np; set(p); nudge();
      if (p - lastSnd > .04) { lastSnd = p; Snd.tear(); buzz(5); const s = stage.getBoundingClientRect(); fx.burst(r.left - s.left + p * r.width, r.top - s.top + r.height * .155, 3, ["#fff", "#e8e8f0"], 2.5, { kind: "confetti", size: 2, life: 35, g: .12, up: 2 }); }
      if (p >= .9) finish();
    };
    const up = () => { tearing = false; };
    function finish() {
      if (done) return; done = true; clearTimeout(idle); tapRes = null; hint("");
      stage.removeEventListener("pointerdown", down); removeEventListener("pointermove", move); removeEventListener("pointerup", up);
      set(1); finishTear(pack); resolve();
    }
    tapRes = finish;
    stage.addEventListener("pointerdown", down); addEventListener("pointermove", move); addEventListener("pointerup", up);
  });
}
function finishTear(pack) {
  const strip = pack.querySelector(".pk-strip"), peel = pack.querySelector(".pk-peel");
  Snd.rip(); buzz([20, 30, 40]); shake(4, .3);
  peel.style.clipPath = "none"; peel.style.opacity = 1; strip.style.opacity = 0;
  fire(gsap.timeline().to(peel, { y: -H() * .25, x: W() * .3, rotate: 50, opacity: 0, duration: .7, ease: "power2.out" })
    .to(pack.querySelector(".pk-cut"), { opacity: 0, duration: .2 }, 0)
    .to(pack.querySelector(".pk-glow"), { opacity: 1, scaleY: 2.2, duration: .35, yoyo: true, repeat: 1 }, 0));
  const c = center(pack), r = pack.getBoundingClientRect(), col = getComputedStyle(pack).getPropertyValue("--rc").trim() || "#fff";
  fx.burst(c.x, c.y - r.height * .36, 24, ["#fff", col], 5, { kind: "star", size: 3, life: 45 });
}

/* 卡由包入面升出嚟（最好嗰張喺最底，最後先見） */
function makeCard(r) {
  const R = RAR[r.rarity], el = document.createElement("div");
  el.className = `card3d ${r.rarity}`; el.style.setProperty("--rc", R.color);
  const word = r.types[0];
  el.innerHTML = `<div class="cd-inner">
    <div class="cd-back"><svg class="emb" viewBox="-55 -55 110 110" aria-hidden="true">${ballArt("great")}</svg><div class="bt">POKÉENGMON</div></div>
    <div class="cd-face">
      ${r.isNew ? '<div class="cd-new">NEW!</div>' : ""}
      <div class="cd-top"><b>${r.name}</b><span>${starStr(R.stars)}</span></div>
      <div class="cd-art"><div class="rays${r.rarity === "legend" ? " rainbow" : ""}"></div><img src="${asset(`animated/${r.id}.gif`)}" alt=""></div>
      <div class="cd-types">${r.types.map(t => `<span class="type" style="background:${TYPE_COL[t]}">${t}</span>`).join("")}</div>
      <div class="cd-word"><small>WORD OF THE CARD</small><b>${word}</b> — ${r.name} is a ${word}-type Pokémon.</div>
      <div class="cd-foot"><span>#${String(r.id).padStart(3, "0")}</span><span>${R.label}</span></div>
      <div class="cd-holo"></div>
    </div></div>`;
  sizeMon(el.querySelector(".cd-art img"), W() * .3);
  el.addEventListener("pointermove", e => { const b = el.getBoundingClientRect();
    el.style.setProperty("--hx", ((e.clientX - b.left) / b.width * 100) + "%"); el.style.setProperty("--hy", ((e.clientY - b.top) / b.height * 100) + "%"); });
  return el;
}
async function emergeCards(pack, results) {
  const order = results.map((r, i) => ({ r, i })).sort((a, b) => RANK[a.r.rarity] - RANK[b.r.rarity] || a.i - b.i);
  const box = $("cards"); box.innerHTML = "";
  const els = order.map((o, k) => { const el = makeCard(o.r); el.style.zIndex = 100 - k; box.appendChild(el);
    gsap.set(el, { y: k * 2.5, x: (k % 2 ? 1 : -1) * k * .8, rotate: (Math.random() - .5) * 3, opacity: 0, scale: .8 }); return { el, r: o.r }; });
  Snd.flipS(); Snd.toss();
  await play(gsap.timeline()
    .to(pack, { y: H() * .55, opacity: 0, duration: .6, ease: "power2.in" }, .1)
    .to(els.map(e => e.el), { opacity: 1, duration: .2 }, 0)
    .fromTo(els.map(e => e.el), { yPercent: 30 }, { yPercent: 0, scale: 1, duration: .6, ease: "back.out(1.4)", stagger: .015 }, 0));
  pack.remove();
  return els;
}

/* 等撳（或者 REVEAL ALL 自動／SKIP） */
function waitTap(autoMs) {
  if (S.skip) return Promise.resolve();
  return new Promise(res => {
    let done = false, timer = 0;
    const end = () => { if (done) return; done = true; clearTimeout(timer); stage.removeEventListener("pointerdown", on); if (tapRes === end) tapRes = null; res(); };
    const on = e => { if (e.target.closest(".stage-btn")) return; end(); };
    tapRes = end;
    if (autoMs) timer = setTimeout(end, autoMs / S.speed); else stage.addEventListener("pointerdown", on);
  });
}

async function revealCards(cards, results, multi) {
  const oa = $("open-all"); oa.textContent = "REVEAL ALL";
  let auto = false;
  if (multi) {
    $("tray").innerHTML = Array.from({ length: cards.length }, () => '<div class="tslot"></div>').join("");
    fire(gsap.from("#tray .tslot", { opacity: 0, y: -10, stagger: .03, duration: .3 }));
    oa.classList.remove("hidden");
    oa.onclick = e => { e.stopPropagation(); if (auto) return; auto = true; Snd.ui(); oa.classList.add("hidden"); if (tapRes) tapRes(); };
  }
  for (let k = 0; k < cards.length; k++) {
    const { el, r } = cards[k];
    if (r.rarity !== "rare") el.classList.add("peek");            /* 卡邊漏光 = 預兆 */
    let tremble = null;
    if (r.rarity === "legend" && !S.skip) { tremble = gsap.to(el, { x: "+=2", duration: .05, yoyo: true, repeat: -1 }); }
    hint(multi ? `TAP TO FLIP · ${k + 1} / ${cards.length}` : "TAP TO FLIP");
    await waitTap(auto ? (r.rarity === "rare" ? 60 : 380) : 0);
    if (tremble) { tremble.kill(); gsap.set(el, { x: 0 }); }
    hint("");
    await flipCard(el, r);
    if (multi) {
      if (k < cards.length - 1) { if (!auto) hint("TAP FOR NEXT CARD"); await waitTap(auto ? (r.rarity === "rare" ? 100 : 700) : 0); hint(""); }
      else await sleep(900);
      await toTray(el, r, k);
    }
  }
  oa.classList.add("hidden");
  if (multi) { await sleep(400); S.skip = false; S.busy = false; showSummary(results); }
  else { S.skip = false; S.busy = false; S.last = results[0]; showSheet(results[0], "single"); liftCard(cards[0].el); }
}

async function flipCard(el, r) {
  const inner = el.querySelector(".cd-inner"), R = RAR[r.rarity], col = R.color, c = center(el);
  const legend = r.rarity === "legend", epic = r.rarity === "epic";
  if (legend) {
    hint("…!!!");
    Snd.riser(1.3); buzz([10, 40, 10, 40, 10]);
    await play(gsap.timeline().to("#dim", { opacity: .85, duration: 1.3, ease: "power2.in" }, 0)
      .to(el, { scale: 1.08, duration: 1.3, ease: "power2.in" }, 0)
      .to(el, { rotate: 2.5, duration: .05, yoyo: true, repeat: 25, ease: "none" }, 0));
    gsap.set(el, { rotate: 0 });
    hint(""); await sleep(420);
    burstFX(c, r); Snd.flipS();
    await play(gsap.timeline().to(inner, { rotateY: 180, duration: 1.0, ease: "power3.out" }).to(el, { scale: 1, duration: .6, ease: "elastic.out(1,.5)" }, 0));
  } else if (epic) {
    Snd.rattle(); buzz([15, 30, 15]);
    await play(gsap.timeline().to(el, { y: "-=14", duration: .2, ease: "power2.out" }).to(el, { rotate: 3, duration: .06, yoyo: true, repeat: 5 }).to(el, { rotate: 0, duration: .05 }));
    Snd.flipS(); Snd.upgrade(1); flash(.6, .4); shake(8, .45);
    fx.burst(c.x, c.y, 70, [col, "#fff"], 9, { life: 60 }); fx.burst(c.x, c.y, 24, [col, "#fff"], 7, { kind: "star", size: 4, life: 70 });
    $("rays").style.setProperty("--rc", col); $("rays").classList.remove("rainbow");
    fire(gsap.fromTo("#rays", { opacity: 0, scale: .4 }, { opacity: .45, scale: 1, duration: .6 }));
    await play(gsap.timeline().to(inner, { rotateY: 180, duration: .6, ease: "back.out(1.4)" }).to(el, { y: "+=14", duration: .4 }, 0));
  } else {
    Snd.flipS(); Snd.pop(2); buzz(10);
    fx.burst(c.x, c.y, 18, [col, "#fff"], 4, { life: 30 });
    await play(gsap.to(inner, { rotateY: 180, duration: .45, ease: "back.out(1.6)" }));
  }
  el.classList.remove("peek");
  if (r.rarity !== "rare") { el.classList.add("holo"); fire(gsap.fromTo(el, { "--hx": "0%", "--hy": "0%" }, { "--hx": "100%", "--hy": "100%", duration: 1.2, ease: "sine.inOut" })); }
  Snd.cry(r.id, .5); Snd.fanfare(r.rarity);
  for (let i = 0; i < R.stars; i++) setTimeout(() => Snd.star(i), 140 * i + 200);
  if (r.isNew) { Snd.stamp(); fire(gsap.from(el.querySelector(".cd-new"), { scale: 3, opacity: 0, duration: .3, ease: "power4.in", delay: .2 })); }
  await sleep(legend ? 900 : epic ? 500 : 200);
}

/* 翻完：飛去頂部收集列 */
async function toTray(el, r, k) {
  const slot = $("tray").children[k], sr = slot.getBoundingClientRect(), er = el.getBoundingClientRect();
  const sc = gsap.getProperty(el, "scale") || 1;
  const dx = (sr.left + sr.width / 2) - (er.left + er.width / 2), dy = (sr.top + sr.height / 2) - (er.top + er.height / 2);
  Snd.flipS();
  fire(gsap.to(["#dim", "#rays", "#halo"], { opacity: 0, duration: .4 }));
  await play(gsap.to(el, { x: `+=${dx}`, y: `+=${dy}`, scale: sc * sr.width / er.width, rotate: 0, duration: .42, ease: "power2.in" }));
  el.remove();
  slot.classList.add("filled"); slot.style.setProperty("--rc", RAR[r.rarity].color);
  slot.innerHTML = `<img src="${asset(`animated/${r.id}.gif`)}" alt="">`;
  Snd.land(k); fire(gsap.fromTo(slot, { scale: 1.4 }, { scale: 1, duration: .35, ease: "back.out(3)" }));
}

/* 單卡：結算 sheet 出嚟時將張卡縮細推上，唔好俾 sheet 遮 */
function liftCard(el) {
  requestAnimationFrame(() => {
    const s = stage.getBoundingClientRect(), er = el.getBoundingClientRect(), sh = $("sheet");
    const sheetTop = s.bottom - sh.offsetHeight - 10, topLim = s.top + 56, avail = sheetTop - topLim;
    const cur = gsap.getProperty(el, "scale") || 1, k = Math.min(1, avail / er.height);
    const dy = (topLim + sheetTop) / 2 - (er.top + er.height / 2);
    gsap.to(el, { y: `+=${dy}`, scale: cur * k, duration: .45, ease: "power3.out" });
  });
}

/* ================================================================
   RESULT SHEET
   ================================================================ */
function showSheet(res, mode) {
  const R = RAR[res.rarity], sh = $("sheet");
  sh.style.setProperty("--rc", R.color);
  $("s-rar").textContent = res.rarity.toUpperCase(); $("s-stars").textContent = starStr(R.stars);
  $("s-name").textContent = res.name; $("s-no").textContent = "#" + String(res.id).padStart(3, "0");
  $("s-types").innerHTML = res.types.map(t => `<span class="type" style="background:${TYPE_COL[t]}">${t}</span>`).join("");
  $("s-gain").innerHTML = res.isNew
    ? `<span class="tag-new">NEW!</span><span>Added to your team · <b>Pokédex +1</b></span>`
    : `<span>Already owned →</span><b>🍬 Candy +1</b><b>⚡ EV +1</b>`;
  const hero = $("sheet-hero");
  if (mode === "detail") { hero.classList.remove("hidden"); hero.querySelector(".rays").style.setProperty("--rc", R.color); hero.querySelector(".rays").classList.toggle("rainbow", res.rarity === "legend");
    const im = $("sheet-img"); im.src = asset(`animated/${res.id}.gif`); sizeMon(im, W() * .3); }
  else hero.classList.add("hidden");
  $("s-again").classList.toggle("hidden", mode === "detail");
  $("s-done").textContent = mode === "detail" ? "Close" : "Done";
  sh.dataset.mode = mode;
  $("skip").classList.add("hidden");
  gsap.fromTo(sh, { y: "110%" }, { y: "0%", duration: .45, ease: "power3.out" });
  if (mode === "single") {
    const np = $("nameplate").getBoundingClientRect(), sheetTop = stage.getBoundingClientRect().bottom - sh.offsetHeight;
    const over = np.bottom + 12 - sheetTop;
    if (over > 0) gsap.to("#reveal", { y: -over, duration: .45, ease: "power3.out" });
  }
  if (!res.isNew && mode === "single") setTimeout(() => Snd.coin(), 350);
}
function hideSheet() { return play(gsap.to("#sheet", { y: "110%", duration: .3, ease: "power2.in" })); }

/* ================================================================
   10× PULL
   ================================================================ */
async function runMulti(results) { await runPack(results); }

function showSummary(results) {
  const sm = $("summary"), g = $("sgrid"); g.innerHTML = "";
  const best = results.reduce((b, r, i) => RANK[r.rarity] > RANK[results[b].rarity] ? i : b, 0);
  results.forEach((r, i) => {
    const R = RAR[r.rarity], c = document.createElement("button");
    c.className = "card" + (i === best && r.rarity !== "rare" ? " best" : "") + (r.rarity === "legend" ? " legend" : "");
    c.style.setProperty("--rc", R.color);
    c.innerHTML = `${r.isNew ? '<span class="cnew">NEW</span>' : '<span class="cdup">🍬+1</span>'}<img src="${asset(`animated/${r.id}.gif`)}" alt=""><span class="cs">${starStr(R.stars)}</span><span class="cn">${r.name}</span>`;
    c.onclick = () => { Snd.ui(); showSheet(r, "detail"); };
    g.appendChild(c);
  });
  const nNew = results.filter(r => r.isNew).length, dup = 10 - nNew;
  const cnt = k => results.filter(r => r.rarity === k).length;
  $("totals").innerHTML = `<span style="color:#ff7a9a">NEW ×${nNew}</span><span>🍬 +${dup}</span><span>⚡ +${dup}</span>` +
    (cnt("legend") ? `<span style="color:var(--legend)">★5 ×${cnt("legend")}</span>` : "") + (cnt("epic") ? `<span style="color:var(--epic)">★4 ×${cnt("epic")}</span>` : "");
  sm.classList.remove("hidden"); $("skip").classList.add("hidden");
  gsap.fromTo(sm, { opacity: 0 }, { opacity: 1, duration: .3 });
  gsap.fromTo(g.children, { rotateY: 180, opacity: 0, scale: .7 }, { rotateY: 0, opacity: 1, scale: 1, duration: .45, stagger: .06, ease: "back.out(1.6)", delay: .15,
    onStart() { Snd.fanfare(results[best].rarity); } });
}

/* ================================================================
   EXIT / AGAIN
   ================================================================ */
async function backToLobby() {
  Snd.ui();
  await play(gsap.to(stage, { opacity: 0, duration: .3 }));
  stage.classList.add("hidden"); resetStage(); gsap.set(stage, { opacity: 1 });
  gsap.set("#dnite-wrap", { y: -H() * .6, scaleX: 1, scaleY: 1 });
  gsap.set("#lobby .cta, #lobby .pity, #lobby .odds", { y: 0, opacity: 1 });
  gsap.to("#dnite-wrap", { y: 0, duration: .8, ease: "bounce.out" });
  gsap.to("#dnite-shadow", { opacity: 1, duration: .6, delay: .4 });
  gsap.fromTo("#bubble", { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: .3, delay: .8, ease: "back.out(2)" });
  $("bubble").textContent = ["Special delivery!", "Again? Let's fly!", "Ready when you are!"][Math.floor(Math.random() * 3)];
  gemsUI(); Snd.ambStart();
}
async function again(mode) {
  const cost = mode === "multi" ? 30 : 3;
  if (S.gems < cost) { toast("Not enough gems — answer quizzes to earn more!"); return; }
  Snd.ui(); S.gems -= cost; S.busy = true; S.skip = false; S.mode = mode;
  const results = mode === "multi" ? multiResults() : [makePull(false)];
  gemsUI();
  if (mode === "multi") { await play(gsap.to("#summary", { opacity: 0, duration: .25 })); } else { await hideSheet(); }
  await play(gsap.to(["#mon", "#rstars", "#nameplate", "#stamp", "#halo", "#rays", "#dim"], { opacity: 0, duration: .3 }));
  resetStage();
  if (mode === "multi") await runMulti(results); else await runSingle(results[0]);
}

/* ================================================================
   WIRING
   ================================================================ */
$("btn-1").onclick = () => startPull("single");
$("btn-10").onclick = () => startPull("multi");
$("skip").onclick = e => { e.stopPropagation(); Snd.ui(); doSkip(); };
$("s-done").onclick = async () => { if ($("sheet").dataset.mode === "detail") { Snd.ui(); await hideSheet(); return; } await hideSheet(); backToLobby(); };
$("s-again").onclick = () => again("single");
$("sum-again").onclick = () => again("multi");
$("sum-done").onclick = () => backToLobby();
$("s-say").onclick = () => { const n = $("s-name").textContent; if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(n); u.lang = "en-US"; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } };
$("btn-sound").onclick = () => { S.sound = !S.sound; $("btn-sound").textContent = S.sound ? "🔊" : "🔇"; Snd.init(); if (S.sound) Snd.ambStart(); else Snd.ambStop(); };
$("btn-dev").onclick = () => $("dev").classList.toggle("hidden");
document.querySelectorAll("#dev-rar button").forEach(b => b.onclick = () => { S.force = b.dataset.v; document.querySelectorAll("#dev-rar button").forEach(x => x.classList.toggle("on", x === b)); });
document.querySelectorAll("#dev-spd button").forEach(b => b.onclick = () => { S.speed = +b.dataset.v; gsap.globalTimeline.timeScale(S.speed); document.querySelectorAll("#dev-spd button").forEach(x => x.classList.toggle("on", x === b)); });
$("dev-gems").onclick = () => { S.gems += 300; gemsUI(); };
$("dev-own").onclick = () => { S.owned = new Set([25, 7, 133, 1]); toast("Owned list reset"); };
document.addEventListener("pointerdown", () => { if (!Snd.ctx) { Snd.init(); Snd.ambStart(); } }, { once: true });
addEventListener("resize", () => { if (!stage.classList.contains("hidden")) fx.resize(); });
window.__gacha = { S, doSkip };   /* 方便 console 驗收 */
lobbyInit();
</script>
